<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="securityGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066FF;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#0052cc;stop-opacity:0.05" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#securityGrad)"/>
  
  <!-- Large Shield -->
  <path d="M 200 50 L 280 90 L 280 160 Q 200 220 200 220 Q 120 160 120 90 Z" 
        fill="none" stroke="#0066FF" stroke-width="3" opacity="0.3"/>
  
  <!-- Main Shield -->
  <path d="M 200 60 L 270 100 L 270 155 Q 200 210 200 210 Q 130 155 130 100 Z" 
        fill="none" stroke="#0066FF" stroke-width="2.5"/>
  
  <!-- Lock Icon Inside Shield -->
  <g transform="translate(200, 130)">
    <!-- Lock body -->
    <rect x="-25" y="-5" width="50" height="35" rx="5" fill="none" stroke="#0066FF" stroke-width="2"/>
    <!-- Lock shackle -->
    <path d="M -15 -5 Q -15 -25 0 -25 Q 15 -25 15 -5" fill="none" stroke="#0066FF" stroke-width="2"/>
    <!-- Lock keyhole -->
    <circle cx="0" cy="10" r="3" fill="#0066FF"/>
  </g>
  
  <!-- Checkmark -->
  <g transform="translate(280, 80)">
    <circle cx="0" cy="0" r="20" fill="none" stroke="#10b981" stroke-width="2"/>
    <path d="M -8 0 L -2 6 L 8 -4" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="80" cy="60" r="8" fill="#0066FF" opacity="0.2"/>
  <circle cx="320" cy="200" r="6" fill="#0066FF" opacity="0.15"/>
  <circle cx="100" cy="250" r="5" fill="#0066FF" opacity="0.1"/>
  
  <!-- Text label -->
  <text x="200" y="270" font-family="Poppins, sans-serif" font-size="14" font-weight="600" 
        text-anchor="middle" fill="#0066FF" opacity="0.6">SECURE</text>
</svg>
