name: checkin_mobile
description: Checkin field app — event check-in and voter mobilization.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  mobile_scanner: ^6.0.2
  intl: ^0.19.0
  url_launcher: ^6.3.1
  flutter_secure_storage: ^9.2.2
  cryptography: ^2.7.0
  # Native AES-GCM on Android/iOS (falls back to pure Dart elsewhere).
  cryptography_flutter: ^2.3.2
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
